[project]
name = "trivia-bench"
version = "0.1.0"
description = "Benchmark de LLM locaux sur les questions de culture générale d'OpenTDB"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Les modules de `app/` s'importent à plat (`from theme import ...`) : Streamlit
# place le répertoire du script d'entrée sur le sys.path, pas la racine du dépôt.
[tool.ruff.lint.isort]
known-first-party = ["trivia_bench", "charts", "data_access", "filters", "theme", "views"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
